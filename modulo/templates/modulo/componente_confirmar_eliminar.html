{% extends 'modulo/base.html' %}
{% block title %}Eliminar {{ componente.nombre }}{% endblock %}
{% block content %}
<div class="card border-danger shadow-sm" style="max-width: 560px;">
    <div class="card-body">
        <h1 class="h4 text-danger">Eliminar componente</h1>
        <p>¿Seguro que quieres eliminar <strong>{{ componente.nombre }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{{ componente.get_absolute_url }}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
