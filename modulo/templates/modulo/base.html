{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventario de Componentes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'modulo/css/base.css' %}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'componente_lista' %}">⚡ Inventario de Componentes</a>
        <div class="navbar-nav ms-auto align-items-center">
            {% if user.is_authenticated %}
                <span class="navbar-text me-3">Hola, {{ user.username }}</span>
                <a class="nav-link" href="{% url 'componente_crear' %}">+ Nuevo</a>
                <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
